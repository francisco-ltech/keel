name: CI

# This repository is local-only for now — there is no remote, so nothing here
# runs today. It is kept current anyway: a workflow written after the fact tends
# to encode what the project looked like months ago.
#
# NOTE: actions are pinned by tag. Pinning by commit SHA (with dependabot
# keeping them fresh) is a follow-up before this repo goes anywhere public.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + types + tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keel -d keel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Default ports here: the service containers are the only ones in the job.
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql+asyncpg://keel:keel@localhost:5432/keel

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the installer's tests clone this checkout as a
          # template, and copier reads its revisions. A shallow clone warns, and
          # the suite makes warnings errors.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      # ty first because it is near-instant, so an obvious error fails the job
      # before mypy spends seven seconds finding it. ADR 0004.
      - name: ty
        run: uv run ty check src tests

      - name: Mypy
        run: uv run mypy src tests

      # The generator is excluded here: it installs a second project and would
      # dominate the feedback loop on an ordinary change.
      - name: Pytest
        run: uv run pytest -m "not generator" -n auto --dist loadfile --cov --cov-report=term-missing

      # Stops a change to the core library from quietly breaking every project
      # generated from it.
      - name: Template generation
        run: uv run pytest -m generator -q

  windows:
    name: windows (library, and a generated project)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # No Postgres or Redis here: service containers are Linux-only on Actions,
      # so the service-backed tests skip. What this proves is that the library
      # imports, type-checks and passes its pure tests on Windows, and that a
      # project generated on Windows installs, lints and type-checks there.
      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Pytest, without services
        run: uv run pytest -m "not generator" -q

      - name: Generate a project on Windows
        run: uv run keel new gen --source . --shape both --defaults --no-git

      - name: The generated project lints and type-checks on Windows
        working-directory: gen
        run: |
          uv run ruff check .
          uv run mypy app tests
