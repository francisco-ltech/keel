# Workspace root. Deliberately not a package — it exists to hold the shared
# tool configuration and the dev environment that `packages/keel` and the
# generated starter app are both checked with.
#
# Everything here is local: the starter template depends on `keel` by path, and
# nothing is published to an index.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
keel = { workspace = true }

[dependency-groups]
dev = [
    "keel[postgres,migrations,factories,queue]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # ty for speed, mypy as the gate. Both must pass; see ADR 0004 for why, and
    # for when dropping mypy becomes reasonable.
    "ty>=0.0.80",
    # Dev-only: the core must not depend on a web framework, but the integration
    # still has to be proved by a test.
    "fastapi>=0.115",
    "httpx>=0.27",
    # Phase 0: the starter template is generated and its tests are run as part
    # of this suite, so the generator is a dev dependency of the workspace.
    "copier>=9.4",
    "types-pyyaml>=6.0",
    "pytest-xdist>=3.8.0",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/keel/src", "packages/keel/tests"]
extend-exclude = [
    # Copier templates are Jinja source, not Python. `.jinja` files are not
    # parsed by ruff anyway; this keeps any stray generated output out.
    "template/**",
    ".generated/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking (formerly "TCH")
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D107",    # undocumented __init__ (documented on the class instead)
    "ANN401",  # dynamically typed expressions (Any) are sometimes the honest type
    # Pydantic and FastAPI need annotations resolvable at runtime, so deferring
    # first-party imports buys start-up time and costs a NameError. TC002 stays.
    "TC001",
    "TC003",
]

[tool.ruff.lint.isort]
# `examples` is our own code, not a third-party package.
known-first-party = ["keel", "examples"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"packages/keel/tests/**/*.py" = ["D", "ANN", "S101"]

[tool.ruff.format]
# defaults: double quotes, trailing commas, magic trailing comma respected

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

# asyncpg ships no py.typed marker. It is used directly only in test
# fixtures that create and drop databases; the library reaches Postgres
# through SQLAlchemy, which is typed.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- ty

[tool.ty.src]
include = ["packages/keel/src", "packages/keel/tests", "examples"]

[tool.ty.environment]
python-version = "3.13"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["packages/keel/tests"]
# The repo root on sys.path so `examples/` is importable by the integration
# test. The example is documentation that has to keep working.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# A warning is a failure. Almost every one is either our own deprecation or a
# resource we forgot to close, and both are worth a red build. Third-party
# noise gets a narrow, dated exception rather than a blanket filter.
filterwarnings = [
    "error",
    # saq 0.26.4 calls redis-py's deprecated setex() internally. Nothing we can
    # do from here; drop this line when saq stops doing it.
    "ignore:Call to deprecated setex.*:DeprecationWarning",
]
markers = [
    "redis: requires a live Redis server (see docker-compose.yml)",
    "postgres: requires a live Postgres server (see docker-compose.yml)",
    "contract: driver contract suite, run against every cache driver",
    "generator: generates the starter template and runs its suite; slow",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["packages/keel/src/keel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]
