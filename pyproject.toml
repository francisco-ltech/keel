[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Batteries for FastAPI — a facade/driver/fake seam for application subsystems."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "redis>=6.0",
    "sqlalchemy[asyncio]>=2.0.40",
]

[project.optional-dependencies]
# Installed by an application that uses the Postgres driver. Kept optional so a
# worker or CLI that only needs the cache does not pull in a database driver.
postgres = ["asyncpg>=0.30"]
# Migration tooling. Optional for the same reason: a worker process runs
# migrations never, and should not carry Alembic to do it.
migrations = ["alembic>=1.13"]
# Test-data factories. Optional because production never builds fake rows, and
# a web process should not carry a data generator into its image.
factories = ["polyfactory>=2.18"]
# The queue driver. Optional because an API-only deployment that dispatches
# nothing, and any process that only reads, should not carry a worker runtime.
queue = ["saq>=0.22"]
# Password hashing. Optional because a service that authenticates by token, or
# not at all, stores no passwords and should not carry an Argon2 binding.
auth = ["pwdlib[argon2]>=0.2"]
# Prometheus exposition. Optional because a service that is scraped by nothing
# should not carry a registry, and the format is not worth writing twice.
metrics = ["prometheus-client>=0.21"]
# The `keel` command: `keel new`, `keel update`. Optional because a service's
# runtime image should not carry a scaffolder.
cli = ["copier>=9.4"]

[project.scripts]
keel = "keel.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

# The library and its tooling in one file. There is one distribution here, so a
# workspace would be a directory level carrying nothing.

[tool.uv.sources]
keel = { workspace = true }

[dependency-groups]
dev = [
    "keel[postgres,migrations,factories,queue,auth,metrics,cli]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "anyio>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # ty for speed, mypy as the gate. Both must pass; see ADR 0004 for why, and
    # for when dropping mypy becomes reasonable.
    "ty>=0.0.80",
    # Dev-only: the core must not depend on a web framework, but the integration
    # still has to be proved by a test.
    "fastapi>=0.115",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "pytest-xdist>=3.8.0",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [
    # Copier templates are Jinja source, not Python. `.jinja` files are not
    # parsed by ruff anyway; this keeps any stray generated output out.
    "template/**",
    ".generated/**",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking (formerly "TCH")
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
]
ignore = [
    "D107",    # undocumented __init__ (documented on the class instead)
    "ANN401",  # dynamically typed expressions (Any) are sometimes the honest type
    # Pydantic and FastAPI need annotations resolvable at runtime, so deferring
    # first-party imports buys start-up time and costs a NameError. TC002 stays.
    "TC001",
    "TC003",
]

[tool.ruff.lint.isort]
# `examples` is our own code, not a third-party package.
known-first-party = ["keel", "examples"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]

[tool.ruff.format]
# defaults: double quotes, trailing commas, magic trailing comma respected

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

# asyncpg ships no py.typed marker. It is used directly only in test
# fixtures that create and drop databases; the library reaches Postgres
# through SQLAlchemy, which is typed.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------- ty

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.environment]
python-version = "3.13"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root on sys.path so `examples/` is importable by the integration
# test. The example is documentation that has to keep working.
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# A warning is a failure. Almost every one is either our own deprecation or a
# resource we forgot to close, and both are worth a red build. Third-party
# noise gets a narrow, dated exception rather than a blanket filter.
filterwarnings = [
    "error",
    # saq 0.26.4 calls redis-py's deprecated setex() internally. Nothing we can
    # do from here; drop this line when saq stops doing it.
    "ignore:Call to deprecated setex.*:DeprecationWarning",
]
markers = [
    "redis: requires a live Redis server (see docker-compose.yml)",
    "postgres: requires a live Postgres server (see docker-compose.yml)",
    "contract: driver contract suite, run against every cache driver",
    "generator: generates the starter template and runs its suite; slow",
]

# ---------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["src/keel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_lines = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]
