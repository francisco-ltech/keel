# Copier template for a new Keel application.
#
# At the repository root rather than under template/, because copier reads a
# git template's configuration from its root: that is what lets
# `keel new invoices` copy straight from the repository, and `keel update` bring
# a project forward when the template moves. The files rendered are the ones
# under `_subdirectory`; nothing else in this repository reaches a project.
#
#     keel new /path/to/new-app                 # from the repository
#     uv run keel new --source . /path/to/app   # from this checkout, by path
#
# `--trust` (unsafe) is needed because the template renders file *names* from
# answers; the CLI passes it.

_subdirectory: "template/project"
_templates_suffix: ".jinja"

# `_exclude` is templated: one block decides what each service shape scaffolds,
# rather than a Jinja conditional inside a dozen file *names*.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  # -- the API half: dropped from a worker-only service. `security.py` and the
  #    whole `sessions` module go with it: both are HTTP, and one imports FastAPI.
  - "{% if not has_api %}app/main.py{% endif %}"
  - "{% if not has_api %}app/security.py{% endif %}"
  - "{% if not has_api %}app/observability.py{% endif %}"
  - "{% if not has_api %}app/inspector.py{% endif %}"
  - "{% if not has_api %}app/modules/sessions{% endif %}"
  - "{% if not has_api %}app/modules/users/router.py{% endif %}"
  - "{% if not has_api %}app/modules/items/router.py{% endif %}"
  - "{% if not has_api %}tests/test_health.py{% endif %}"
  - "{% if not has_api %}tests/test_inspector.py{% endif %}"
  - "{% if not has_api %}tests/test_metrics.py{% endif %}"
  - "{% if not has_api %}tests/test_sessions.py{% endif %}"
  - "{% if not has_api %}tests/test_users.py{% endif %}"
  - "{% if not has_api %}tests/test_items.py{% endif %}"
  # -- the worker half: dropped from an API-only service. `0002` creates the
  #    queue's own tables, so it ships only where there is a queue to need them.
  - "{% if not has_worker %}app/worker.py{% endif %}"
  - "{% if not has_worker %}app/healthcheck.py{% endif %}"
  - "{% if not has_worker %}app/modules/items/jobs.py{% endif %}"
  - "{% if not has_worker %}app/modules/users/jobs.py{% endif %}"
  - "{% if not has_worker %}tests/test_worker_wiring.py{% endif %}"
  - "{% if not has_worker %}app/migrations/versions/0002_queue_tables.py{% endif %}"
  - "{% if not has_worker %}tests/test_jobs.py{% endif %}"

_message_after_copy: |
  Created {{ project_name }} in {{ _copier_conf.dst_path }} ({{ service_shape }} shape).

    cd {{ _copier_conf.dst_path }}
    just install
    just migrate     # creates the schema
    just test
    {% if service_shape == 'worker' %}just worker      # the consume side{% else %}just dev         # {% if has_worker %}API and worker together{% else %}http://localhost:8000/docs{% endif %}{% endif %}

  The database and cache default to the local dev services on ports
  {{ postgres_port }} and {{ redis_port }}; `just up` starts its own if you need them.
  {% if not has_worker %}
  This is an API-only scaffold. Adding the worker half later is
  `keel update --data service_shape=both`, not a new project.
  {% elif not has_api %}
  This is a worker-only scaffold. Adding the API half later is
  `keel update --data service_shape=both`, not a new project.
  {% endif %}

project_name:
  type: str
  help: Human-readable name of the application
  default: Keel Starter

project_slug:
  type: str
  help: Python-safe name (package metadata, cache namespace, compose project)
  default: "{{ project_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z][a-z0-9_]*$')) %}
    project_slug must be lowercase letters, digits and underscores, starting with a letter.
    {% endif %}

description:
  type: str
  help: One-line description of the application
  default: "A FastAPI application built on Keel."

service_shape:
  type: str
  help: >-
    Which entrypoints to scaffold. One codebase and one schema either way: a
    service deploys as an API process, a worker process, or both, from the same
    image with the entrypoint chosen per deployment. This answer decides what is
    written now, not what is possible later — `keel update` adds the other
    half without regenerating anything.
  default: both
  choices:
    "API only — app/main.py and routers": api
    "Worker only — app/worker.py and jobs": worker
    "Both — one image, two entrypoints": both

has_api:
  type: bool
  # Computed, never asked, and never recorded: copier leaves a `when: false`
  # question out of the answers file and recomputes it from service_shape.
  when: false
  default: "{{ service_shape in ['api', 'both'] }}"

has_worker:
  type: bool
  when: false
  default: "{{ service_shape in ['worker', 'both'] }}"

python_version:
  type: str
  help: Minimum Python version
  default: "3.13"
  choices:
    - "3.13"
    - "3.14"

postgres_port:
  type: int
  help: Host port Postgres listens on
  default: 5433

mailpit_smtp_port:
  type: int
  help: Host port Mailpit's SMTP listens on
  default: 1025

mailpit_ui_port:
  type: int
  help: Host port Mailpit's web UI and API listen on
  default: 8025

redis_port:
  type: int
  help: Host port Redis listens on
  default: 6380

keel_source:
  type: str
  help: >-
    Where the generated project takes the Keel library from. `git` pins it to the
    exact commit this template came from, so the scaffold and the library never
    disagree; `path` links a local checkout, editable, for developing Keel itself.
  default: git
  choices:
    "The Keel repository, pinned to this template's commit": git
    "A local checkout, editable": path

keel_repository:
  type: str
  help: The git URL the generated project installs Keel from.
  default: https://github.com/francisco-ltech/keel
  when: "{{ keel_source == 'git' }}"

keel_path:
  type: str
  help: Absolute path to the Keel checkout to link.
  default: "{{ _copier_conf.src_path }}"
  when: "{{ keel_source == 'path' }}"
